<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  charset 은 문서 앞 1024바이트 안에 와야 브라우저가 UTF-8 로 읽는다.
  이 페이지에는 <head> 가 없어(HTML5 암묵 태그) doctype 바로 뒤에 둔다.
  없으면 한글이 전부 깨진다 — 2026-09-10 실측으로 발견.
-->
<!--
  전송 구간 암호화 입력 — `docs/composition/05-contracts.md` 8-10절.

  이 페이지는 딱 하나만 예외로 외부 스크립트를 부른다(아래 <script src>).
  그 외 외부 리소스(CSS·폰트·분석 스크립트 등)는 여전히 전부 금지다 —
  8-10절 "남는 위험" 1항: 이 페이지의 배포 경로가 뚫리면 공개키를
  바꿔치기당한다. 외부 리소스를 하나라도 더 불러오면 그 공격 표면이
  하나 늘어난다.

  2026-09-10 정정 — 예전에는 이 예외조차 두지 않고 "외부 스크립트
  금지"를 문자 그대로 따랐다. 그런데 텔레그램 공식 문서
  (core.telegram.org/bots/webapps)를 직접 확인한 결과, `window.Telegram`
  객체 자체를 **이 스크립트가 만든다**(원본 3,397줄 중 249·2670행 —
  `window.Telegram = window.Telegram || {}`). 네이티브 클라이언트는
  `TelegramWebviewProxy` 라는 저수준 브리지만 주입할 뿐(137행), 그
  객체를 `WebApp.sendData()` 로 감싸는 코드는 이 스크립트 안에만 있다.
  즉 이 스크립트 없이는 애초에 `sendData` 를 부를 방법이 없다 — 이전
  지시가 틀렸다. 텔레그램 웹뷰 안에서 텔레그램 자기 스크립트를 부르는
  것이라 임의 CDN보다 공급망 위험이 낮다고 판단해 이 하나만 허용한다.

  **공개키는 두 경로로 들어온다(우선순위 순서):**
  1. URL 파라미터 `?k=<SPKI DER base64>` — 프로젝트가 페이지 하나만
     호스팅하고, 각 봇이 자기 공개키를 붙여 가리키는 방식(기본으로
     권장). 있으면 **무조건 이 값을 쓴다** — 아래 PUBLIC_KEY_SPKI_B64
     상수는 쳐다보지도 않는다. 형식이 잘못됐으면 박힌 키로 조용히
     대체하지 않고 막는다(피싱 링크 방어 — 아래 "지문" 참고)
  2. 없으면 아래 PUBLIC_KEY_SPKI_B64 상수(박아넣기) — `tools/gen-webapp.py`
     가 이 자리를 채운다(자체 호스팅자를 위한 경로). 지금은 플레이스홀더다

  `telegram-web-app.js` 원본에 `location.search` 를 읽거나 쓰는 코드,
  `history.replaceState`/`pushState` 호출이 **0건**임을 직접 확인했다
  (텔레그램은 자기 파라미터를 해시 `#` 에만 붙인다, 원본 7행) — 그래서
  `?k=` 는 이 스크립트를 불러와도 보존된다.
-->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>시크릿 암호화 입력</title>
<style>
  :root {
    /* 텔레그램 테마 변수 — 텔레그램 WebView 가 설정해주면 그 값을,
       아니면(공식 스크립트를 안 불러왔거나 일반 브라우저) 이 기본값을
       쓴다. */
    --bg: var(--tg-theme-bg-color, #ffffff);
    --secondary-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
    --text: var(--tg-theme-text-color, #222222);
    --hint: var(--tg-theme-hint-color, #707579);
    --link: var(--tg-theme-link-color, #2481cc);
    --button: var(--tg-theme-button-color, #2481cc);
    --button-text: var(--tg-theme-button-text-color, #ffffff);
    --destructive: #e53935;
    --ok: #2e7d32;
    /* "임시 보기" 상태 전용 색(주황/호박색) — 포커스(파랑)·오류(빨강)·
       성공(초록)과 겹치지 않는 네 번째 의미색. 값이 화면에 노출된 동안
       입력칸 테두리에 써서 "지금 보이고 있다"를 시각적으로 눈에 띄게
       한다(과제 지시 "보이는 동안 그 사실이 눈에 띄게 해라"). */
    --warn: #f0932b;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
      sans-serif;
    padding: 20px 16px 32px;
  }

  h1 {
    font-size: 18px;
    margin: 4px 0 4px;
  }

  p.desc {
    color: var(--hint);
    font-size: 13px;
    line-height: 1.5;
    margin: 0 0 20px;
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--hint);
    margin: 16px 0 6px;
  }

  input[type="password"],
  input[type="text"] {
    width: 100%;
    padding: 12px 48px 12px 12px; /* 오른쪽은 눈 버튼 자리 */
    font-size: 16px;
    border: 2px solid var(--secondary-bg);
    border-radius: 10px;
    background: var(--secondary-bg);
    color: var(--text);
    outline: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  input[type="password"]:focus,
  input[type="text"]:focus {
    border-color: var(--button);
  }

  /* 입력칸 + 눈 버튼을 겹쳐 배치하기 위한 래퍼. */
  .input-wrapper {
    position: relative;
  }

  .eye-btn {
    position: absolute;
    right: 4px;
    top: 4px;
    bottom: 4px;
    width: 44px; /* 모바일 탭 최소 권장 크기 */
    border: none;
    background: transparent;
    color: var(--hint);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    border-radius: 8px;
    padding: 0;
  }

  .eye-btn:active {
    background: rgba(127, 127, 127, 0.15);
  }

  /* "임시 보기" 활성 상태 — 값이 화면에 그대로 보이는 동안 입력칸
     테두리·배경을 눈에 띄게 바꾼다. 어깨너머로 보일 수 있다는 신호. */
  .input-wrapper.revealed input {
    border-color: var(--warn);
    background: rgba(240, 147, 43, 0.12);
    box-shadow: 0 0 0 3px rgba(240, 147, 43, 0.18);
  }

  .input-wrapper.revealed .eye-btn {
    color: var(--warn);
  }

  .reveal-status {
    margin-top: 6px;
    font-size: 12px;
    font-weight: 700;
    color: var(--warn);
  }

  .reveal-status[hidden] {
    display: none;
  }

  .toolbar-row {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .paste-btn {
    flex: 0 0 auto;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid var(--hint);
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }

  .paste-btn:active {
    background: rgba(127, 127, 127, 0.15);
  }

  .paste-btn[hidden] {
    display: none;
  }

  .counter {
    margin-left: auto;
    font-size: 13px;
    font-weight: 600;
    color: var(--hint);
    text-align: right;
  }

  .counter.over {
    color: var(--destructive);
    font-weight: 700;
  }

  .counter-hint {
    margin-top: 2px;
    font-size: 11px;
    color: var(--hint);
    text-align: right;
  }

  .counter-hint[hidden] {
    display: none;
  }

  .error {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid rgba(229, 57, 53, 0.35);
    background: rgba(229, 57, 53, 0.12);
    color: var(--destructive);
    font-size: 13px;
    font-weight: 600;
    line-height: 1.5;
    white-space: pre-line;
  }

  .notice {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(46, 125, 50, 0.12);
    color: var(--ok);
    font-size: 13px;
    line-height: 1.5;
  }

  /* 지문 박스 — 피싱 방어의 핵심인데 예전엔 회색 잔글씨라 눈에 안 띄었다.
     의도적으로 "경고" 색 계열(주황 테두리)을 써서 값 입력칸보다 먼저
     시선이 가게 한다. */
  .keyinfo {
    margin-top: 14px;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1.5px solid var(--warn);
    background: rgba(240, 147, 43, 0.1);
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
  }

  .keyinfo strong {
    color: var(--text);
  }

  .keyinfo .fp {
    display: inline-block;
    margin-top: 2px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 1px;
    word-break: break-all;
  }

  .keyinfo .warn-line {
    margin-top: 6px;
    color: var(--destructive);
    font-weight: 600;
  }

  .keyinfo[hidden] {
    display: none;
  }

  button#submit {
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    background: var(--button);
    color: var(--button-text);
    cursor: pointer;
  }

  button#submit:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  #blocked {
    display: none;
  }

  #blocked .error {
    margin-top: 16px;
  }

  #form-area[hidden],
  #blocked[hidden] {
    display: none;
  }
</style>

<h1>🔒 시크릿 암호화 입력</h1>
<p class="desc">
  여기서 입력한 값은 이 페이지 안에서 즉시 암호화되고, 암호문만 텔레그램을
  거쳐 전달됩니다. 텔레그램 채팅 이력에는 평문이 남지 않습니다.
</p>

<div id="blocked" hidden>
  <div class="error" id="blocked-message"></div>
</div>

<div class="keyinfo" id="keyinfo" hidden>
  <div>이 페이지는 <strong id="keyinfo-source">-</strong>로 암호화합니다.</div>
  <div>공개키 지문: <span class="fp" id="keyinfo-fp">-</span></div>
  <div class="warn-line">⚠️ 봇이 알려준 지문과 다르면 입력하지 말고 창을 닫아주세요(피싱 링크일 수 있습니다).</div>
</div>

<div id="form-area" hidden>
  <label for="value">값</label>
  <div class="input-wrapper" id="value-wrapper">
    <input id="value" type="password" autocomplete="off" spellcheck="false" autocapitalize="off" />
    <button id="toggle-visibility" class="eye-btn" type="button" aria-pressed="false" aria-label="값 잠깐 보기">👁</button>
  </div>
  <div class="reveal-status" id="reveal-status" hidden>
    🙈 값이 화면에 보이고 있습니다 · <span id="reveal-seconds">8</span>초 후 자동으로 가려집니다
  </div>

  <div class="toolbar-row">
    <button id="paste-btn" class="paste-btn" type="button" hidden>📋 붙여넣기</button>
    <div>
      <div class="counter" id="counter">0 / 190 바이트</div>
      <div class="counter-hint" id="counter-hint" hidden>
        한글 등 non-ASCII 문자는 1자당 최대 3바이트를 차지합니다.
      </div>
    </div>
  </div>

  <div class="error" id="form-error" hidden></div>
  <div class="notice" id="form-notice" hidden></div>

  <button id="submit" type="button" disabled>암호화해서 전송</button>
</div>

<script>
  (function () {
    "use strict";

    // tools/gen-webapp.py 가 이 문자열을 실제 공개키(base64, SPKI DER)로
    // 치환한다. 치환되지 않은 채로 쓰이면(개발 중 index.html 을 원본
    // 그대로 열었을 때) 아래 init() 이 길이로 감지해 막는다 — 플레이스홀더
    // 문자열 자체를 비교 대상으로 다시 적지 않는다. 그러면
    // gen-webapp.py 의 단순 문자열 치환이 그 비교문 안의 같은 문자열까지
    // 바꿔버려 검사 자체가 무의미해지기 때문이다(치환 전후 항상 "같다"가
    // 되어버린다) — 대신 실제 RSA-2048 SPKI DER base64 길이(392자 안팎)
    // 와 플레이스홀더 길이(24자)가 확연히 다르다는 점을 이용한다.
    var PUBLIC_KEY_SPKI_B64 = "__PUBLIC_KEY_SPKI_B64__";
    var MIN_VALID_PUBLIC_KEY_LENGTH = 300;

    // 8-10절 표 — 두 쪽이 정확히 같아야 하는 파라미터. 여기서는
    // WebCrypto 쪽만 정의한다(서버는 `src/store/keypair.py`).
    //   알고리즘: RSA-OAEP · 해시: SHA-256 · MGF1 해시: SHA-256(WebCrypto
    //   는 RsaHashedImportParams.hash 하나로 MGF1 해시까지 함께 정해진다
    //   — 별도로 지정하는 API 자체가 없다) · label: 없음(encrypt() 호출
    //   시 label 을 아예 주지 않으면 없는 것으로 처리된다).
    var MAX_PLAINTEXT_BYTES = 190;

    // 2026-09-10 신설 — URL 파라미터로 받은 공개키(`?k=`)의 쿼리 파라미터
    // 이름. 봇(`handlers.py::_build_webapp_button_url`)이 같은 이름으로
    // 붙인다 — 둘이 반드시 일치해야 한다.
    var URL_PUBLIC_KEY_PARAM = "k";

    // 2026-09-10 UI 개선 — "임시 보기" 자동 재가림 시간(초). 8초로 정한
    // 근거: 붙여넣은 값(보통 40~130자 API 키)을 한 번 훑어보는 데
    // 필요한 시간은 몇 초면 충분하고, 그보다 오래 켜두면 어깨너머
    // 노출 창이 불필요하게 길어진다. 다만 값을 계속 고치는 중(입력
    // 이벤트 발생)이면 매번 8초로 되돌려 카운트다운을 재시작한다 —
    // "편집 중에 갑자기 가려짐" 을 막으면서도 "가만히 두면 곧 가려짐"
    // 은 그대로 지킨다. 더 보고 싶으면 눈 버튼을 다시 누르면 된다(잠금
    // 기간 없음) — 요구사항은 "자동으로 다시 가려라"이지 "한 번만 보여줘라"
    // 가 아니다.
    var REVEAL_SECONDS = 8;

    var blockedEl = document.getElementById("blocked");
    var blockedMessageEl = document.getElementById("blocked-message");
    var keyInfoEl = document.getElementById("keyinfo");
    var keyInfoSourceEl = document.getElementById("keyinfo-source");
    var keyInfoFpEl = document.getElementById("keyinfo-fp");
    var formAreaEl = document.getElementById("form-area");
    var valueWrapperEl = document.getElementById("value-wrapper");
    var valueEl = document.getElementById("value");
    var toggleVisibilityEl = document.getElementById("toggle-visibility");
    var revealStatusEl = document.getElementById("reveal-status");
    var revealSecondsEl = document.getElementById("reveal-seconds");
    var pasteBtnEl = document.getElementById("paste-btn");
    var counterEl = document.getElementById("counter");
    var counterHintEl = document.getElementById("counter-hint");
    var formErrorEl = document.getElementById("form-error");
    var formNoticeEl = document.getElementById("form-notice");
    var submitEl = document.getElementById("submit");

    // init() 이 성공적으로 해석한 공개키(WebCrypto CryptoKey) — onSubmit()
    // 이 매 제출마다 다시 파싱하지 않고 이걸 그대로 쓴다.
    var resolvedPublicKey = null;

    // "임시 보기" 상태 — 노출 중인지, 남은 초, 카운트다운 인터벌 핸들.
    // 토글 상태 자체는 어디에도 저장하지 않는다(변수는 페이지를 새로
    // 열면 사라진다) — 과제 지시 "다음에 열면 항상 가려진 상태로
    // 시작"은 이 변수를 영속화하지 않는 것만으로 자연히 지켜진다.
    var revealTimerId = null;
    var revealSecondsLeft = 0;

    function block(message) {
      blockedMessageEl.textContent = message;
      blockedEl.hidden = false;
      formAreaEl.hidden = true;
    }

    function utf8ByteLength(str) {
      return new TextEncoder().encode(str).length;
    }

    function base64FromArrayBuffer(buffer) {
      var bytes = new Uint8Array(buffer);
      var binary = "";
      for (var i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return btoa(binary);
    }

    function base64ToArrayBuffer(b64) {
      var binary = atob(b64);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes.buffer;
    }

    function applyTelegramTheme(webApp) {
      // 공식 스크립트가 있으면 테마 변수를 이미 root 에 걸어주지만,
      // 없을 수도 있으므로(위 경고 참고) themeParams 가 있으면 우리가
      // 직접 CSS 변수로 옮긴다 — 있으면 더 정확하고, 없어도 위 :root
      // 기본값으로 자연스럽게 대체된다.
      if (!webApp || !webApp.themeParams) {
        return;
      }
      var mapping = {
        bg_color: "--tg-theme-bg-color",
        secondary_bg_color: "--tg-theme-secondary-bg-color",
        text_color: "--tg-theme-text-color",
        hint_color: "--tg-theme-hint-color",
        link_color: "--tg-theme-link-color",
        button_color: "--tg-theme-button-color",
        button_text_color: "--tg-theme-button-text-color"
      };
      Object.keys(mapping).forEach(function (key) {
        var v = webApp.themeParams[key];
        if (v) {
          document.documentElement.style.setProperty(mapping[key], v);
        }
      });
    }

    function updateCounter() {
      var value = valueEl.value;
      var bytes = utf8ByteLength(value);
      counterEl.textContent = bytes + " / " + MAX_PLAINTEXT_BYTES + " 바이트";
      counterEl.classList.toggle("over", bytes > MAX_PLAINTEXT_BYTES);
      // 문자 수보다 바이트 수가 많으면(=한글 등 multi-byte 문자가 섞여
      // 있으면) 왜 숫자가 갑자기 크게 뛰는지 설명하는 힌트를 보여준다 —
      // 과제 지시 "한글은 3배로 먹는다는 게 보이는가"에 대한 답.
      counterHintEl.hidden = bytes === value.length;
      return bytes;
    }

    // 2026-09-10 UI 개선 — "값 확인(다시 입력)" 칸을 없앴다.
    //
    // 판단 근거: 이 칸의 역할은 "두 번 쳐서 서로 다르면 오타로 간주"였다.
    // 그런데 이 입력의 실제 사용 패턴은 (특히 API 키처럼 긴 값은) 손으로
    // 치는 게 아니라 **붙여넣기**다 — 같은 값을 클립보드에서 두 번
    // 붙여넣어봐야 "서로 다름"이 걸릴 확률은 낮고(둘 다 같은 잘못된
    // 값이면 여전히 못 잡는다), 오히려 매번 두 번 붙여넣어야 하는
    // 불편함만 남는다. 반면 이제 눈 버튼으로 **실제 글자를 그대로**
    // 볼 수 있으므로, "두 입력이 같은가"라는 간접 확인보다 "이 값이
    // 맞는가"라는 직접 확인이 더 강한 방어다. 오타 방어가 사라지는
    // 게 아니라 다른(더 정확한) 방식으로 옮겨간 것으로 판단했다.
    function validate() {
      formErrorEl.hidden = true;
      var bytes = updateCounter();
      var value = valueEl.value;

      var ok = true;
      var problems = [];
      if (value.length === 0) {
        ok = false;
      } else if (bytes > MAX_PLAINTEXT_BYTES) {
        ok = false;
        problems.push(
          "⚠️ 값이 " + MAX_PLAINTEXT_BYTES + "바이트 상한을 넘습니다(실측 " + bytes + "바이트). " +
            "SSH 개인키·긴 JWT 는 이 방식으로 보낼 수 없습니다 — 서버에서 직접 설정해주세요."
        );
      }

      if (problems.length > 0) {
        formErrorEl.textContent = problems.join("\n");
        formErrorEl.hidden = false;
      }

      submitEl.disabled = !ok;
      return ok;
    }

    // ------------------------------------------------------------------
    // "임시 보기" — 눈 버튼.
    // ------------------------------------------------------------------

    function stopRevealTimer() {
      if (revealTimerId !== null) {
        clearInterval(revealTimerId);
        revealTimerId = null;
      }
    }

    function updateToggleLabel() {
      if (valueEl.type === "text") {
        toggleVisibilityEl.textContent = "🙈";
        toggleVisibilityEl.setAttribute("aria-label", "값 가리기");
        toggleVisibilityEl.setAttribute("aria-pressed", "true");
        revealStatusEl.hidden = false;
        revealSecondsEl.textContent = String(revealSecondsLeft);
      } else {
        toggleVisibilityEl.textContent = "👁";
        toggleVisibilityEl.setAttribute("aria-label", "값 잠깐 보기");
        toggleVisibilityEl.setAttribute("aria-pressed", "false");
        revealStatusEl.hidden = true;
      }
    }

    function hideValue() {
      stopRevealTimer();
      valueEl.type = "password";
      valueWrapperEl.classList.remove("revealed");
      updateToggleLabel();
    }

    function restartRevealTimer() {
      stopRevealTimer();
      revealSecondsLeft = REVEAL_SECONDS;
      updateToggleLabel();
      revealTimerId = setInterval(function () {
        revealSecondsLeft -= 1;
        if (revealSecondsLeft <= 0) {
          hideValue();
          return;
        }
        updateToggleLabel();
      }, 1000);
    }

    function revealValue() {
      valueEl.type = "text";
      valueWrapperEl.classList.add("revealed");
      restartRevealTimer();
      // 커서를 유지해 보던 위치에서 그대로 이어 볼 수 있게 한다.
      valueEl.focus();
    }

    function onToggleVisibilityClick() {
      if (valueEl.type === "password") {
        revealValue();
      } else {
        hideValue();
      }
    }

    // ------------------------------------------------------------------
    // 붙여넣기 버튼 — Clipboard API 를 쓸 수 있을 때만 보여준다(기능
    // 감지). 실패(권한 거부 등)해도 죽지 않고 안내만 한다. 모바일에서도
    // 원래 길게 눌러 붙여넣기는 되지만, 텔레그램 인앱 브라우저는 길게
    // 누르기 메뉴가 가려지거나 어색하게 동작하는 경우가 보고돼 있어
    // 명시적인 버튼을 하나 더 둔다.
    async function onPasteClick() {
      try {
        var text = await navigator.clipboard.readText();
        if (!text) {
          return;
        }
        valueEl.value = text;
        valueEl.dispatchEvent(new Event("input", { bubbles: true }));
        if (valueEl.type === "text") {
          restartRevealTimer();
        }
      } catch (e) {
        formErrorEl.textContent =
          "⚠️ 클립보드 접근이 거부됐습니다. 입력칸을 길게 눌러 붙여넣어 주세요.";
        formErrorEl.hidden = false;
      }
    }

    async function importPublicKey(b64) {
      var raw = base64ToArrayBuffer(b64);
      return crypto.subtle.importKey(
        "spki",
        raw,
        { name: "RSA-OAEP", hash: "SHA-256" },
        false,
        ["encrypt"]
      );
    }

    // 2026-09-10 신설 — `?k=` 파라미터를 읽는다. `telegram-web-app.js` 는
    // `location.search` 를 읽거나 쓰지 않으므로(원본 확인, 위 HTML 주석
    // 참고) 이 값은 그 스크립트를 불러온 뒤에도 그대로 보존된다.
    function getUrlPublicKeyB64() {
      try {
        var params = new URLSearchParams(window.location.search);
        var raw = params.get(URL_PUBLIC_KEY_PARAM);
        return raw && raw.length > 0 ? raw : null;
      } catch (e) {
        // URLSearchParams 자체가 없는 아주 오래된 환경 — URL 파라미터
        // 경로를 못 쓴다고만 보고, 박힌 키 폴백으로 넘어가게 한다.
        return null;
      }
    }

    // 공개키(SPKI DER, base64) 원문의 SHA-256 해시 앞 8바이트를 16진수로.
    // "이 페이지가 어떤 키로 암호화하는지" 를 사용자가 눈으로 대조할 수
    // 있게 하는 것이 목적이다 — 피싱 링크가 다른 `?k=` 를 붙여 보내면
    // 이 지문이 봇이 알려준 값과 달라진다.
    async function fingerprintHex(publicKeyB64) {
      var der = base64ToArrayBuffer(publicKeyB64);
      var digest = await crypto.subtle.digest("SHA-256", der);
      var bytes = new Uint8Array(digest).slice(0, 8);
      var hex = [];
      for (var i = 0; i < bytes.length; i++) {
        hex.push(bytes[i].toString(16).padStart(2, "0"));
      }
      return hex.join(" ");
    }

    // 공개키를 확정한다 — 우선순위(README/과제 지시 그대로):
    //   1) URL 파라미터 `?k=` 가 있으면 **무조건** 이걸 쓴다. 형식이
    //      틀렸으면(base64 가 아니거나 SPKI 로 파싱되지 않으면) 박힌
    //      키로 조용히 대체하지 않고 예외를 던져 막는다 — 피싱 링크가
    //      깨진 `?k=` 를 붙여 "그래도 어떻게든 열리는" 상황을 막기 위함.
    //   2) 없으면 박힌 PUBLIC_KEY_SPKI_B64 로 폴백한다(자체 호스팅 경로).
    // 반환값 { source, b64, cryptoKey } — source 는 "url" | "baked".
    async function resolvePublicKey() {
      var urlKeyB64 = getUrlPublicKeyB64();
      if (urlKeyB64 !== null) {
        var urlCryptoKey;
        try {
          urlCryptoKey = await importPublicKey(urlKeyB64);
        } catch (e) {
          throw new Error(
            "URL 의 공개키(?k=)가 올바른 형식이 아닙니다. 봇이 보낸 링크를 " +
              "다시 확인해주세요. 주소를 직접 손으로 옮기다 잘렸을 수도 있습니다."
          );
        }
        return { source: "url", b64: urlKeyB64, cryptoKey: urlCryptoKey };
      }

      if (!PUBLIC_KEY_SPKI_B64 || PUBLIC_KEY_SPKI_B64.length < MIN_VALID_PUBLIC_KEY_LENGTH) {
        throw new Error(
          "공개키가 없습니다. 봇이 보낸 링크에 '?k=' 파라미터가 붙어 있는지 " +
            "확인하거나, tools/gen-webapp.py 로 만든 배포본을 열어주세요" +
            "(webapp/README.md 참고)."
        );
      }
      var bakedCryptoKey;
      try {
        bakedCryptoKey = await importPublicKey(PUBLIC_KEY_SPKI_B64);
      } catch (e) {
        throw new Error("이 페이지에 박힌 공개키가 올바른 형식이 아닙니다.");
      }
      return { source: "baked", b64: PUBLIC_KEY_SPKI_B64, cryptoKey: bakedCryptoKey };
    }

    async function encryptValue(publicKey, plaintext) {
      var data = new TextEncoder().encode(plaintext);
      // label 을 아예 주지 않는다 — 8-10절 "label: 없음(null)".
      var ciphertext = await crypto.subtle.encrypt(
        { name: "RSA-OAEP" },
        publicKey,
        data
      );
      return base64FromArrayBuffer(ciphertext);
    }

    async function onSubmit() {
      if (!validate()) {
        return;
      }
      submitEl.disabled = true;
      submitEl.textContent = "전송 중...";
      formErrorEl.hidden = true;
      formNoticeEl.hidden = true;

      try {
        var ciphertextB64 = await encryptValue(resolvedPublicKey.cryptoKey, valueEl.value);

        // 값(평문)을 참조하던 변수를 더 쓰지 않는다 — 이 시점 이후로는
        // ciphertextB64 만 다룬다.
        valueEl.value = "";
        hideValue(); // 임시 보기 타이머도 함께 정리한다.

        window.Telegram.WebApp.sendData(ciphertextB64);

        formNoticeEl.textContent = "전송했습니다. 이 창은 곧 닫힙니다.";
        formNoticeEl.hidden = false;
        submitEl.textContent = "전송 완료";

        // sendData() 는 문서상 Mini App 을 자동으로 닫는다. 혹시 닫히지
        // 않는 클라이언트를 위한 방어적 재시도일 뿐, 실패해도 무시한다.
        setTimeout(function () {
          try {
            window.Telegram.WebApp.close();
          } catch (e) {
            /* 무시 — 이미 닫혔거나 close() 가 없을 수 있다 */
          }
        }, 300);
      } catch (err) {
        // 예외 메시지에 평문을 담지 않는다 — err 는 WebCrypto/브라우저가
        // 던진 것이라 우리가 값을 넣지 않았지만, 혹시 몰라 err 자체를
        // 화면에 그대로 찍지 않고 고정 문구만 보여준다.
        formErrorEl.textContent = "⚠️ 암호화 또는 전송 중 오류가 발생했습니다. 다시 시도해주세요.";
        formErrorEl.hidden = false;
        submitEl.disabled = false;
        submitEl.textContent = "암호화해서 전송";
      }
    }

    async function init() {
      // 1) secure context — WebCrypto 는 HTTPS(secure context)에서만 쓸 수 있다.
      if (!window.isSecureContext) {
        block(
          "이 페이지는 HTTPS(secure context)에서만 동작합니다. " +
            "GitHub Pages 로 배포된 주소로 다시 열어주세요."
        );
        return;
      }

      // 2) crypto.subtle 가용성.
      if (!(window.crypto && window.crypto.subtle)) {
        block("이 브라우저/환경은 암호화(WebCrypto)를 지원하지 않습니다.");
        return;
      }

      // 3) 공개키 확정 — `?k=` 우선, 없으면 박힌 키로 폴백(resolvePublicKey
      //    참고). 형식이 잘못됐으면 여기서 막힌다.
      try {
        resolvedPublicKey = await resolvePublicKey();
      } catch (err) {
        block(err.message);
        return;
      }

      // 3-1) 지문 표시 — 실패해도(예: 아주 오래된 브라우저) 암호화 자체를
      //      막지 않는다. 부가 정보이지 필수 검증 단계가 아니다.
      try {
        var fp = await fingerprintHex(resolvedPublicKey.b64);
        keyInfoFpEl.textContent = fp;
        keyInfoSourceEl.textContent =
          resolvedPublicKey.source === "url"
            ? "봇이 보낸 링크의 공개키(?k=)"
            : "이 페이지에 내장된 공개키";
        keyInfoEl.hidden = false;
      } catch (e) {
        /* 지문 표시 실패는 무시 — 본 기능(암호화)에는 영향이 없다 */
      }

      // 4) Telegram.WebApp 가용성 — sendData 는 텔레그램 WebView 안에서만
      //    존재한다. 없으면 전송할 방법이 없으므로 명확히 막는다.
      var webApp = window.Telegram && window.Telegram.WebApp;
      if (!webApp || typeof webApp.sendData !== "function") {
        block(
          "텔레그램 앱 안에서 열어야 합니다(Telegram.WebApp 을 찾을 수 없습니다). " +
            "봇의 답장 키보드 버튼을 통해 이 페이지를 열어주세요."
        );
        return;
      }

      applyTelegramTheme(webApp);
      try {
        webApp.ready();
        webApp.expand();
      } catch (e) {
        /* 무시 — 두 메서드 모두 있으면 좋을 뿐, 필수는 아니다 */
      }

      formAreaEl.hidden = false;
      valueEl.addEventListener("input", function () {
        validate();
        if (valueEl.type === "text") {
          restartRevealTimer(); // 편집 중이면 자동 가림 타이머를 계속 늦춘다.
        }
      });
      toggleVisibilityEl.addEventListener("click", onToggleVisibilityClick);
      updateToggleLabel();
      // 붙여넣기 버튼은 Clipboard API 를 실제로 쓸 수 있을 때만 보여준다
      // (기능 감지) — 없는 환경에서는 버튼 자체를 노출하지 않는다.
      if (navigator.clipboard && typeof navigator.clipboard.readText === "function") {
        pasteBtnEl.hidden = false;
        pasteBtnEl.addEventListener("click", onPasteClick);
      }
      submitEl.addEventListener("click", onSubmit);
      validate();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
</script>
